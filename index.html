  <body>
    <div id="root"></div>
    <script>
      // Restore clean URLs after a static host's 404.html bounces an unknown
      // path back as "/?/path". Runs before the app boots.
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            });
          var path = '/' + decoded.shift();
          window.history.replaceState(
            null,
            '',
            path + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
